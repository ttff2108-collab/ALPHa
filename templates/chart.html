<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charting Hub | ALPHA</title>
    <meta name="description"
        content="ALPHA Charting Hub – Full TradingView charts with all analysis tools, economic calendar and live signals.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a020f0;
            --primary-dim: rgba(160, 32, 240, 0.3);
            --bg: #0B0E14; /* Deep charcoal */
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(160, 32, 240, 0.3);
            --border-hover: rgba(160, 32, 240, 0.8);
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --cyan: #00BCD4;
            --red: #FF5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── NAVBAR ── */
        .navbar {
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            background: rgba(11, 14, 20, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            justify-content: space-between;
            flex-shrink: 0;
            gap: 1rem;
            z-index: 100;
        }

        .nav-logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            text-shadow: 0 0 10px rgba(160, 32, 240, 0.5);
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }

        .nav-link {
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            transition: 0.2s;
            white-space: nowrap;
        }

        .nav-link:hover {
            color: var(--primary);
        }

        /* ── SYMBOL BAR ── */
        .symbol-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: none;
        }

        .symbol-bar::-webkit-scrollbar {
            display: none;
        }

        .sym-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
            margin-right: 0.25rem;
        }

        .sym-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .sym-btn:hover {
            border-color: var(--primary);
            color: #fff;
        }

        .sym-btn.active {
            background: rgba(160, 32, 240, 0.25);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 8px rgba(160, 32, 240, 0.3);
        }

        .sym-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .sym-search-wrap {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 0.25rem 0.75rem;
            flex-shrink: 0;
        }

        .sym-search-wrap:focus-within {
            border-color: var(--primary);
        }

        .sym-search {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.78rem;
            font-family: 'Inter', sans-serif;
            width: 110px;
        }

        .sym-search::placeholder {
            color: var(--text-dim);
        }

        /* ── MAIN LAYOUT ── */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 0;
            overflow: hidden;
        }

        /* ── CHART AREA ── */
        .chart-area {
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid var(--border);
            background: var(--bg);
        }

        #tv_chart_container {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* Glassmorphism Overlays */
        .chart-overlay {
            position: absolute;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 0.75rem;
            padding: 0.5rem;
        }

        .alpha-smc-dash {
            top: 10px;
            right: 60px; /* Leave room for LWC price scale */
            min-width: 180px;
        }

        .mtf-dash {
            bottom: 30px; /* Leave room for LWC time scale */
            right: 60px;
            min-width: 150px;
        }

        .dash-header {
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
        }

        .dash-row {
            display: flex;
            justify-content: space-between;
            margin: 0.2rem 0;
        }

        .dash-label {
            color: var(--text-dim);
        }

        .dash-val {
            font-weight: 600;
        }
        
        .c-green { color: #00e676; }
        .c-red { color: var(--red); }
        .c-yellow { color: #ffd600; }
        .c-gray { color: #9e9e9e; }
        .bg-cyan { background: rgba(0, 188, 212, 0.2); padding: 0 4px; border-radius: 3px; color: #00BCD4; }
        .bg-blue { background: rgba(30, 144, 255, 0.2); padding: 0 4px; border-radius: 3px; color: #1e90ff; }

        /* ── SIDEBAR ── */
        .sidebar {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            background: rgba(0, 0, 0, 0.4);
            gap: 0;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--primary-dim);
            border-radius: 4px;
        }

        .widget {
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .widget-head {
            padding: 0.65rem 1rem;
            font-weight: 600;
            font-size: 0.82rem;
            color: #fff;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .widget-body {
            flex: 1;
            overflow-y: auto;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .workspace { grid-template-columns: 1fr; }
            .chart-area { height: 65vh; border-right: none; }
        }
    </style>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="/home" class="nav-logo">⚡ ALPHA</a>
        <div class="nav-links">
            <a href="/home" class="nav-link">Dashboard</a>
            <a href="/chat" class="nav-link">Global Chat</a>
            <a href="/gallery" class="nav-link">The Lab</a>
            {% if user.role == 'admin' %}
            <a href="/admin" class="nav-link" style="color:#fbbf24;">Admin</a>
            {% endif %}
        </div>
    </nav>

    <!-- SYMBOL CHANGE BAR -->
    <div class="symbol-bar" id="symbolBar">
        <span class="sym-label">Quick:</span>
        <button class="sym-btn active">BTCUSDT 🥇</button>
        <div class="sym-divider"></div>
        <span class="sym-label" style="text-transform: none; font-weight: normal; font-size: 0.7rem;">Live Binance Stream Engine</span>
    </div>

    <!-- WORKSPACE -->
    <div class="workspace">
        <!-- CHART -->
        <div class="chart-area">
            <!-- Overlays -->
            <div class="chart-overlay alpha-smc-dash">
                <div class="dash-header">
                    <span style="color:var(--cyan)">WOLF X / ALPHA SMC</span>
                    <span style="color:#ffd600">LIVE</span>
                </div>
                <div class="dash-row"><span class="dash-label">Trend</span> <span id="dash-trend" class="dash-val c-gray">FLAT</span></div>
                <div class="dash-row"><span class="dash-label">EMA Cloud</span> <span id="dash-cloud" class="dash-val c-gray">-</span></div>
                <div class="dash-row"><span class="dash-label">Vol Spike</span> <span id="dash-vol" class="dash-val c-gray">-</span></div>
                <div class="dash-row"><span class="dash-label">SMMA</span> <span id="dash-smma" class="dash-val c-gray">-</span></div>
                <div class="dash-row"><span class="dash-label">TSI</span> <span id="dash-tsi" class="dash-val c-gray">-</span></div>
            </div>

            <div class="chart-overlay mtf-dash">
                <div class="dash-header">
                    <span>Wave Matrix</span>
                </div>
                <div class="dash-row"><span class="dash-label">1M</span> <span id="dash-wave-1m" class="dash-val dash-bg bg-blue">BEAR</span></div>
                <div class="dash-row"><span class="dash-label">5M</span> <span id="dash-wave-5m" class="dash-val dash-bg bg-blue">BEAR</span></div>
            </div>

            <div id="tv_chart_container"></div>
        </div>

        <!-- SIDEBAR (Preserved) -->
        <div class="sidebar">
            <!-- Economic Calendar -->
            <div class="widget" style="height:340px; flex-shrink:0;">
                <div class="widget-head">📅 Economic Calendar</div>
                <div class="widget-body" style="padding:0; overflow:hidden;">
                    <div class="tradingview-widget-container" style="height:100%;">
                        <div class="tradingview-widget-container__widget" style="height:100%;"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
                        { "colorTheme": "dark", "isTransparent": true, "width": "100%", "height": "100%", "locale": "en", "importanceFilter": "-1,0,1" }
                        </script>
                    </div>
                </div>
            </div>

            <!-- News Feed -->
            <div class="widget" style="height:340px; flex-shrink:0;">
                <div class="widget-head">📰 News Flow</div>
                <div class="widget-body" style="padding:0; overflow:hidden;">
                    <div class="tradingview-widget-container" style="height:100%;">
                        <div class="tradingview-widget-container__widget" style="height:100%;"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
                        { "feedMode": "all_symbols", "colorTheme": "dark", "isTransparent": true, "displayMode": "regular", "width": "100%", "height": "100%", "locale": "en" }
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="/static/js/trading.js"></script>
</body>
</html>
